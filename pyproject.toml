[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gama-verse"
version = "1.0.0"
description = "Metrical scansion of Galician poetry (GAMA, Galician Metrical Analyzer)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Pablo Ruiz Fabo" },
    { name = "Anxo Alonso Pérez" },
    { name = "Xabier Suárez Cordero" },
]
requires-python = ">=3.10"
dependencies = [
    "kenlm==0.3.0",
    "stanza>=1.6",
]

[project.scripts]
gama-verse = "gama_verse.cli:main"
gama-verse-download = "gama_verse.download:main"

[tool.setuptools.package-data]
gama_verse = ["preprocessing/data/*", "gumper/data/*"]
